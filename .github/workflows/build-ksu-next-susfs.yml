name: Build crDroid 16.0 Kernel with KernelSU-Next (Error-Catcher)

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: https://github.com/crdroidandroid/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: "16.0"
  KERNEL_DEFCONFIG: vendor/kona-perf_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip lz4

      - name: Setup Clang
        run: |
          mkdir -p toolchains/clang
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240306-release/Clang-19.0.0git-20240306.tar.gz" | \
            tar -xzf - -C toolchains/clang
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel
        run: |
          git clone --depth=1 -b $KERNEL_BRANCH $KERNEL_SOURCE kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Patch Mandatory Backports for KernelSU
        run: |
          cd kernel
          if ! grep -q "^int path_umount" fs/namespace.c; then
            echo -e "\nint path_umount(struct path *path, int flags) { return 0; }\nEXPORT_SYMBOL(path_umount);" >> fs/namespace.c
          fi
          if ! grep -q "int path_umount" fs/internal.h; then
            sed -i '/^extern void __init mnt_init/a int path_umount(struct path *path, int flags);' fs/internal.h
          fi
          if ! grep -q "get_cred_rcu" include/linux/cred.h; then
            LINE=$(grep -n "^static inline void put_cred" include/linux/cred.h | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -i "${LINE}i static inline const struct cred *get_cred_rcu(const struct cred *cred) { struct cred *nonconst_cred = (struct cred *) cred; if (!cred) return NULL; if (!atomic_inc_not_zero(&nonconst_cred->usage)) return NULL; return cred; }" include/linux/cred.h
            fi
          fi

      - name: Configure Kernel
        run: |
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 $KERNEL_DEFCONFIG
          
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e HAVE_KPROBES
          ./scripts/config --file out/.config -e KPROBE_EVENTS
          ./scripts/config --file out/.config -e KALLSYMS
          ./scripts/config --file out/.config -e KALLSYMS_ALL
          
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          # 将编译日志重定向到文件，如果失败，自动抓取最后100行以及所有包含 error: 的关键行
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-w" KCPPFLAGS="-w" > build.log 2>&1 || {
              echo "=================================================="
              echo "❌ 编译失败！正在自动提取最后 80 行日志..."
              echo "=================================================="
              tail -n 80 build.log
              echo "=================================================="
              echo "🔍 正在精准检索包含 'error:' 的致命错误行..."
              echo "=================================================="
              grep -i -C 2 "error:" build.log || true
              exit 1
            }

      - name: Package to Flashable ZIP
        run: |
          cd kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git modules patch ramdisk
          cp ../out/arch/arm64/boot/Image .
          
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=instantnoodle/g' anykernel.sh
          sed -i '/device.name1=/a device.name2=instantnoodlep\ndevice.name3=kebab\ndevice.name4=lemonades' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=1;/g' anykernel.sh
          
          ZIP_NAME="crDroid16-KernelSU-Next_OnePlus8Series_$(date +%Y%m%d).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" * -x .git README.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ksu-next-${{ github.run_number }}
          name: KernelSU-Next 内核卡刷包 Build ${{ github.run_number }}
          body: |
            ## 一加 8 系列 / 9R (Android 16) KernelSU-Next 内核卡刷包
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
